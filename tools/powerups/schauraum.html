<title>Power-up-Schauraum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Schauraum der Power-ups im Look von Headstars: oben die Bühne mit dem ganzen Ablauf, darunter alle Kugeln nach Familie.
   Bewusst nur dunkel (Spielwelt), Farben und Schriften wie im Spiel. */
:root {
  color-scheme: dark;
  --ink: #15112e; --page: #0a1240; --panel: #121c5e; --panel2: #1a2775; --fg: #eef1ff; --muted: #a7b2ee;
  --cream: #fff7e6; --yellow: #ffd02b;
  --atk: #ff6a2b; --def: #3fb8ff; --mov: #3ddc84; --chaos: #b07cff; --gold: #ffc21a;
  --display: "Lilita One", "Arial Black", Impact, sans-serif;
  --body: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--fg); font-family: var(--body); font-weight: 800; }
body { padding-block: 10px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 4px 0 0; letter-spacing: .3px; }
.lead { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 78ch; }
.stage { position: relative; border-radius: 20px; overflow: hidden; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); background: #16237a; }
.stage canvas { display: block; width: 100%; height: auto; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: -4px; }
.info { background: var(--panel); border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 1.4; flex: 1 1 320px; min-width: 0; }
.info b { font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: .2px; }
.info span { color: var(--muted); }
.ctrls { display: flex; gap: 6px; flex-wrap: wrap; }
.tb { background: var(--cream); color: var(--ink); border-radius: 10px; padding: 6px 11px; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
.tb[aria-pressed="true"] { background: var(--yellow); }
.tb:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.fam { display: flex; flex-direction: column; gap: 8px; }
.fam h2 { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: 19px; display: flex; align-items: center; gap: 8px; }
.fam h2 i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: 0 0 0 2px #fff; }
.fam h2 small { font-family: var(--body); font-size: 12.5px; color: var(--muted); font-weight: 800; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 10px; }
.card { background: var(--panel); border-radius: 16px; padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 4px; text-align: left; border: 2px solid transparent; transition: border-color .15s, transform .15s; }
.card:hover { transform: translateY(-2px); }
.card[aria-pressed="true"] { border-color: var(--yellow); background: var(--panel2); }
.card canvas { width: 100%; height: auto; aspect-ratio: 1.35; display: block; }
.card .nm { font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: .2px; }
.card .ds { color: var(--muted); font-size: 12px; line-height: 1.35; font-weight: 700; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: rgb(255 255 255 / 10%); color: var(--fg); }
.chip.new { background: var(--yellow); color: var(--ink); }
.chip.rk { background: rgb(63 184 255 / 22%); color: #cdeeff; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>

<div class="wrap">
  <h1>Power-up-Schauraum</h1>
  <p class="lead">Alle 18 Power-ups im Look des Spiels. Die Bühne zeigt den ganzen Ablauf: Ankündigung, Kugel in der Luft, Einsammeln per Schuss, Wirkung am Kopf oder Feld und das Ende. Tippe unten ein Power-up an. Mit „Ton an“ hörst du auch die Klänge der Familien.</p>
  <div class="stage">
    <canvas id="cv" width="1200" height="540" aria-label="Bühne: Ablauf des gewählten Power-ups"></canvas>
  </div>
    <div class="bar">
      <div class="info" id="info"></div>
      <div class="ctrls">
        <button class="tb" id="bAgain">Nochmal</button>
        <button class="tb" id="bSlow" aria-pressed="false">Zeitlupe</button>
        <button class="tb" id="bAuto" aria-pressed="false">Alle der Reihe nach</button>
        <button class="tb" id="bSound" aria-pressed="false">Ton an</button>
      </div>
    </div>
  <div id="grid"></div>
</div>

<script>
// ===================== Daten =====================
const FAM = {

  def: { name: "Abwehr", sub: "Eis, Blau", col: "#3fb8ff", hi: "#c9f2ff" },

const PUS = [
  { id: "fire", name: "Feuerschuss", fam: "atk", st: "bleibt", rk: true, to: "me", tag: "Nächster Schuss brennt", ds: "Nächster Schuss wird ein Feuer-Super." },
  { id: "boot", name: "Riesenschuh", fam: "atk", st: "neu", rk: true, to: "me", tag: "Schuh ×1,6, Schuss +12 %", ds: "Riesiger Schuh, mehr Wumms, langsamerer Schwung." },
  { id: "spin", name: "Effet", fam: "atk", st: "neu", rk: true, to: "me", tag: "3 Schüsse mit Topspin", ds: "Hohe Schüsse senken sich unter die Latte." },
  { id: "goal", name: "Riesentor", fam: "atk", st: "überarbeitet", rk: true, to: "op", tag: "Gegnertor 60 px höher", ds: "Das Tor des Gegners wächst sichtbar." },
  { id: "wall", name: "Torwand", fam: "def", st: "überarbeitet", rk: true, to: "me", tag: "Tor zu, 2 Treffer hält sie", ds: "Energiewand vor dem Tor, bricht nach 2 harten Treffern." },
  { id: "bubble", name: "Schutzblase", fam: "def", st: "neu", rk: true, to: "me", tag: "Fängt die nächste Gemeinheit ab", ds: "Blockt Mini, Eisblock, Erdbeben, Schubser, Supers." },
  { id: "clone", name: "Doppelgänger", fam: "def", st: "neu", rk: false, to: "me", tag: "Hologramm hält dein Tor", ds: "Kopie auf der Torlinie, bricht nach 2 Treffern." },
  { id: "time", name: "Zeitblase", fam: "def", st: "neu", rk: false, to: "me", tag: "Ball in deiner Hälfte halb so schnell", ds: "3 s Zeitlupe für den Ball in deiner Hälfte." },
  { id: "wings", name: "Flügelschuhe", fam: "mov", st: "überarbeitet", rk: true, to: "me", tag: "Schneller, höher, Doppelsprung", ds: "Fasst Turbo, Sprungfeder und Doppelsprung zusammen." },
  { id: "head", name: "Riesenkopf", fam: "mov", st: "überarbeitet", rk: true, to: "me", tag: "Kopf ×1,35, Kopfball +15 %", ds: "Großer Kopf, härtere Kopfbälle." },
  { id: "magnet", name: "Magnetschuh", fam: "mov", st: "neu", rk: true, to: "me", tag: "Ball festhalten, dann abziehen", ds: "Taste halten: Ball klebt bis 0,6 s am Schuh." },
  { id: "mini", name: "Mini-Gegner", fam: "chaos", st: "überarbeitet", rk: true, to: "op", tag: "Gegner ×0,7 für 5 s", ds: "Gegner schrumpft und schießt schwächer." },
  { id: "ice", name: "Eisblock", fam: "chaos", st: "überarbeitet", rk: false, to: "op", tag: "Freihämmern spart Zeit", ds: "Bis 1,5 s eingefroren, jede Taste bricht Eis ab." },
  { id: "quake", name: "Erdbeben", fam: "chaos", st: "neu", rk: false, to: "op", tag: "Gegner hüpft hoch", ds: "Wer am Boden steht, taumelt kurz. Ball springt hoch." },
  { id: "float", name: "Schwerelos", fam: "chaos", st: "neu", rk: false, to: "field", tag: "Ball schwebt, für beide", ds: "Schwerkraft des Balls ×0,4 für 5 s." },
  { id: "wind", name: "Rückenwind", fam: "chaos", st: "überarbeitet", rk: false, to: "field", tag: "Wind treibt den Ball zum Gegner", ds: "5 s Wind, jetzt sichtbar übers ganze Feld." },
  { id: "super", name: "Super voll", fam: "gold", st: "bleibt", rk: false, to: "me", tag: "Super sofort bereit", ds: "Super-Leiste läuft in einem Goldschwall voll." },
  { id: "portal", name: "Portal", fam: "gold", st: "neu", rk: false, to: "field", tag: "Ein Schuss, zwei Löcher", ds: "Eingang in deiner Hälfte, Ausgang vor dem Gegnertor." },
];
const byId = Object.fromEntries(PUS.map(p => [p.id, p]));

// ===================== Grundformen =====================
const TAU = Math.PI * 2, INK = "#15112e";
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIn = t => Math.pow(clamp(t, 0, 1), 2);
const elastic = t => { t = clamp(t, 0, 1); return t === 0 || t === 1 ? t : Math.pow(2, -9 * t) * Math.sin((t * 10 - 0.75) * TAU / 3) + 1; };
const spring = (t, f = 9, d = 5) => 1 - Math.exp(-d * t) * Math.cos(f * t);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function outline(c, w) { c.lineWidth = w; c.strokeStyle = INK; c.stroke(); }

// ---------- Symbole (weiß mit Tintenrand, Kantenlänge etwa 2s) ----------
function bootPath(c, s, k = 1) {
  c.beginPath();
  c.moveTo(-0.75 * s * k, 0.55 * s * k); c.lineTo(0.62 * s * k, 0.55 * s * k);
  c.quadraticCurveTo(0.95 * s * k, 0.55 * s * k, 0.9 * s * k, 0.15 * s * k);
  c.quadraticCurveTo(0.82 * s * k, -0.12 * s * k, 0.25 * s * k, -0.12 * s * k);
  c.lineTo(-0.2 * s * k, -0.75 * s * k); c.lineTo(-0.72 * s * k, -0.75 * s * k);
  c.quadraticCurveTo(-0.85 * s * k, 0, -0.75 * s * k, 0.55 * s * k); c.closePath();
}
function drawIcon(c, id, s, t) {
  c.save(); c.lineJoin = "round"; c.lineCap = "round";
  const W = "#ffffff", lw = Math.max(1.5, s * 0.13);
  const fillOut = () => { c.fillStyle = W; c.fill(); outline(c, lw); };
  switch (id) {
    case "fire": {
      bootPath(c, s * 0.82); c.translate(0, s * 0.2); fillOut(); c.translate(0, -s * 0.2);
      c.beginPath(); c.moveTo(-0.15 * s, -0.25 * s); c.quadraticCurveTo(-0.65 * s, -0.75 * s, -0.25 * s, -1.05 * s); c.quadraticCurveTo(-0.15 * s, -0.75 * s, 0.05 * s, -0.7 * s);
      c.quadraticCurveTo(0.05 * s, -1.0 * s, 0.35 * s, -1.1 * s); c.quadraticCurveTo(0.25 * s, -0.7 * s, 0.55 * s, -0.45 * s); c.quadraticCurveTo(0.35 * s, -0.2 * s, -0.15 * s, -0.25 * s);
      c.fillStyle = "#ffd36b"; c.fill(); outline(c, lw); break;
    }
    case "boot": bootPath(c, s * 1.05); fillOut();
      c.beginPath(); c.moveTo(-0.55 * s, 0.3 * s); c.lineTo(0.55 * s, 0.3 * s); c.lineWidth = lw * 0.8; c.strokeStyle = INK; c.stroke();
      for (const [x, y, a] of [[-0.95, -0.9, -2.3], [1.0, -0.55, -0.6]]) { c.save(); c.translate(x * s, y * s); c.rotate(a); c.beginPath(); c.moveTo(0, 0); c.lineTo(0.35 * s, 0); c.lineWidth = lw; c.stroke(); c.restore(); } break;
    case "spin": circ(c, 0.12 * s, 0.1 * s, 0.55 * s); fillOut();
      c.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * TAU / 5; c.lineTo(0.12 * s + Math.cos(a) * 0.2 * s, 0.1 * s + Math.sin(a) * 0.2 * s); } c.closePath(); c.fillStyle = INK; c.fill();
      c.beginPath(); c.arc(0.12 * s, 0.1 * s, 0.92 * s, -2.7, -0.4); c.lineWidth = lw * 1.6; c.strokeStyle = INK; c.stroke(); c.lineWidth = lw * 0.7; c.strokeStyle = W; c.stroke();
      c.save(); c.translate(0.12 * s + Math.cos(-0.4) * 0.92 * s, 0.1 * s + Math.sin(-0.4) * 0.92 * s); c.rotate(1.2); c.beginPath(); c.moveTo(0, -0.28 * s); c.lineTo(0.3 * s, 0.05 * s); c.lineTo(-0.25 * s, 0.12 * s); c.closePath(); c.fillStyle = W; c.fill(); outline(c, lw * 0.8); c.restore(); break;
    case "goal": c.beginPath(); c.moveTo(-0.85 * s, 0.85 * s); c.lineTo(-0.85 * s, -0.35 * s); c.lineTo(0.85 * s, -0.35 * s); c.lineTo(0.85 * s, 0.85 * s);
      c.lineWidth = lw * 2.2; c.strokeStyle = INK; c.stroke(); c.lineWidth = lw * 1.1; c.strokeStyle = W; c.stroke();
      c.beginPath(); c.moveTo(0, -1.05 * s); c.lineTo(0.42 * s, -0.55 * s); c.lineTo(0.15 * s, -0.55 * s); c.lineTo(0.15 * s, 0.45 * s); c.lineTo(-0.15 * s, 0.45 * s); c.lineTo(-0.15 * s, -0.55 * s); c.lineTo(-0.42 * s, -0.55 * s); c.closePath(); fillOut(); break;
    case "wall": c.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * TAU / 6; c.lineTo(Math.cos(a) * 0.95 * s, Math.sin(a) * 0.95 * s); } c.closePath(); fillOut();
      c.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * TAU / 6; c.lineTo(Math.cos(a) * 0.48 * s, Math.sin(a) * 0.48 * s); } c.closePath(); c.lineWidth = lw * 0.8; c.strokeStyle = INK; c.stroke(); break;
    case "bubble": circ(c, 0, 0, 0.9 * s); c.fillStyle = "rgba(255,255,255,.85)"; c.fill(); outline(c, lw);
      c.beginPath(); c.arc(0, 0, 0.62 * s, 3.6, 4.5); c.lineWidth = lw; c.strokeStyle = INK; c.stroke();
      star(c, 0.45 * s, -0.45 * s, 0.22 * s, INK); break;
    case "clone": for (const [x, a] of [[0.28, 0.55], [-0.22, 1]]) { c.globalAlpha = a; circ(c, x * s, 0.05 * s, 0.62 * s); fillOut(); circ(c, (x + 0.15) * s, -0.02 * s, 0.1 * s); c.fillStyle = INK; c.fill(); circ(c, (x + 0.42) * s, -0.02 * s, 0.1 * s); c.fill(); } c.globalAlpha = 1; break;
    case "time": c.beginPath(); c.moveTo(-0.6 * s, -0.9 * s); c.lineTo(0.6 * s, -0.9 * s); c.lineTo(0.08 * s, 0); c.lineTo(0.6 * s, 0.9 * s); c.lineTo(-0.6 * s, 0.9 * s); c.lineTo(-0.08 * s, 0); c.closePath(); fillOut();
      c.beginPath(); c.moveTo(-0.32 * s, 0.75 * s); c.lineTo(0.32 * s, 0.75 * s); c.lineTo(0, 0.38 * s); c.closePath(); c.fillStyle = "#ffd36b"; c.fill(); break;
    case "wings": c.save(); c.translate(0.12 * s, 0.25 * s); bootPath(c, s * 0.78); fillOut(); c.restore();
      c.save(); c.translate(-0.45 * s, -0.25 * s); c.rotate(-0.5 + Math.sin((t || 0) * 9) * 0.25);
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-0.55 * s, -0.75 * s, -0.15 * s, -0.95 * s); c.quadraticCurveTo(0.1 * s, -0.5 * s, 0.3 * s, -0.75 * s); c.quadraticCurveTo(0.35 * s, -0.3 * s, 0, 0); c.fillStyle = W; c.fill(); outline(c, lw * 0.85); c.restore(); break;
    case "head": circ(c, 0, 0, 0.55 * s); fillOut(); circ(c, 0.12 * s, -0.08 * s, 0.09 * s); c.fillStyle = INK; c.fill(); circ(c, 0.34 * s, -0.08 * s, 0.09 * s); c.fill();
      for (let i = 0; i < 4; i++) { c.save(); c.rotate(Math.PI / 4 + i * Math.PI / 2); c.translate(0.82 * s, 0); c.beginPath(); c.moveTo(0.22 * s, 0); c.lineTo(-0.08 * s, -0.2 * s); c.lineTo(-0.08 * s, 0.2 * s); c.closePath(); c.fillStyle = W; c.fill(); outline(c, lw * 0.8); c.restore(); } break;
    case "magnet": c.beginPath(); c.arc(0, -0.1 * s, 0.62 * s, Math.PI, 0); c.lineTo(0.62 * s, 0.75 * s); c.lineTo(0.22 * s, 0.75 * s); c.lineTo(0.22 * s, -0.1 * s); c.arc(0, -0.1 * s, 0.22 * s, 0, Math.PI, true); c.lineTo(-0.22 * s, 0.75 * s); c.lineTo(-0.62 * s, 0.75 * s); c.closePath(); fillOut();
      c.fillStyle = "#ff4d6d"; c.fillRect(-0.62 * s, 0.42 * s, 0.4 * s, 0.33 * s); c.fillRect(0.22 * s, 0.42 * s, 0.4 * s, 0.33 * s); c.strokeRect(-0.62 * s, 0.42 * s, 0.4 * s, 0.33 * s); c.strokeRect(0.22 * s, 0.42 * s, 0.4 * s, 0.33 * s); break;
    case "mini": circ(c, 0, 0.05 * s, 0.32 * s); fillOut();
      for (const d of [-1, 1]) { c.save(); c.translate(d * 0.8 * s, 0.05 * s); c.beginPath(); c.moveTo(-d * 0.3 * s, 0); c.lineTo(d * 0.02 * s, -0.22 * s); c.lineTo(d * 0.02 * s, 0.22 * s); c.closePath(); c.fillStyle = W; c.fill(); outline(c, lw * 0.8); c.restore(); } break;
    case "ice": for (let a = 0; a < 3; a++) { c.save(); c.rotate(a * Math.PI / 3); c.beginPath(); c.moveTo(0, -0.95 * s); c.lineTo(0, 0.95 * s); c.lineWidth = lw * 2.1; c.strokeStyle = INK; c.stroke(); c.lineWidth = lw; c.strokeStyle = W; c.stroke();
        for (const d of [-1, 1]) { c.beginPath(); c.moveTo(0, d * 0.55 * s); c.lineTo(0.25 * s, d * 0.8 * s); c.moveTo(0, d * 0.55 * s); c.lineTo(-0.25 * s, d * 0.8 * s); c.lineWidth = lw * 1.5; c.strokeStyle = INK; c.stroke(); c.lineWidth = lw * 0.6; c.strokeStyle = W; c.stroke(); } c.restore(); } break;
    case "quake": c.fillStyle = W; c.beginPath(); c.moveTo(-0.95 * s, 0.35 * s); c.lineTo(0.95 * s, 0.35 * s); c.lineTo(0.95 * s, 0.85 * s); c.lineTo(-0.95 * s, 0.85 * s); c.closePath(); fillOut();
      c.beginPath(); c.moveTo(-0.1 * s, -0.95 * s); c.lineTo(0.2 * s, -0.4 * s); c.lineTo(-0.15 * s, -0.15 * s); c.lineTo(0.18 * s, 0.35 * s); c.lineTo(-0.05 * s, 0.85 * s); c.lineWidth = lw * 2; c.strokeStyle = INK; c.stroke(); c.lineWidth = lw * 0.8; c.strokeStyle = "#ffd36b"; c.stroke(); break;
    case "float": circ(c, 0, 0, 0.5 * s); fillOut(); c.save(); c.scale(1, 0.32); c.beginPath(); c.arc(0, 0, 0.95 * s, -0.2, Math.PI + 0.2); c.lineWidth = lw * 2.4; c.strokeStyle = INK; c.stroke(); c.lineWidth = lw * 1.1; c.strokeStyle = W; c.stroke(); c.restore();
      star(c, 0.75 * s, -0.75 * s, 0.18 * s, W, true); star(c, -0.8 * s, -0.55 * s, 0.12 * s, W, true); break;
    case "wind": for (const [x0, wy, w] of [[-0.5, -0.5, 0.9], [-0.85, 0, 1.4], [-0.6, 0.5, 1]]) { c.beginPath(); c.moveTo(x0 * s, wy * s); c.lineTo((x0 + w) * s, wy * s); c.quadraticCurveTo((x0 + w + 0.35) * s, (wy - 0.05) * s, (x0 + w + 0.2) * s, (wy - 0.32) * s); c.lineWidth = lw * 2.3; c.strokeStyle = INK; c.stroke(); c.lineWidth = lw * 1.1; c.strokeStyle = W; c.stroke(); } break;
    case "super": c.beginPath(); [[-0.15, -0.95], [0.55, -0.95], [0.15, -0.15], [0.6, -0.15], [-0.3, 0.95], [-0.05, 0.1], [-0.5, 0.1]].forEach(([a, b], n) => (n ? c.lineTo(a * s, b * s) : c.moveTo(a * s, b * s))); c.closePath(); c.fillStyle = "#fff6c8"; c.fill(); outline(c, lw); break;
    case "portal": for (const [x, col] of [[-0.42, "#ff8a2b"], [0.42, "#3fb8ff"]]) { c.save(); c.translate(x * s, 0); c.scale(0.55, 1); circ(c, 0, 0, 0.75 * s); c.fillStyle = col; c.fill(); c.lineWidth = lw * 1.6; c.strokeStyle = INK; c.stroke(); circ(c, 0, 0, 0.42 * s); c.fillStyle = "#fff"; c.fill(); c.restore(); } break;
  }
  c.restore();

  c.globalAlpha = a; if (wallHits >= 1) { c.strokeStyle = "#ffffff"; c.lineWidth = 3; c.beginPath(); c.moveTo(108, G - 130); c.lineTo(118, G - 110); c.lineTo(104, G - 96); c.lineTo(116, G - 70); c.moveTo(118, G - 110); c.lineTo(122, G - 125); c.stroke(); }
  c.restore(); }
function drawIce(c, h, grow, τ) { const pts = [[-1.1, -0.2], [-0.7, -1.15], [0.2, -1.3], [1.05, -0.8], [1.25, 0.3], [0.7, 1.15], [-0.4, 1.2], [-1.2, 0.6]], r = h.r * 1.05 * easeOut(grow); const jit = iceCracks && τ % 0.4 < 0.06 ? 3 : 0;
  c.save(); c.translate(h.x + (Math.random() - 0.5) * jit, h.y + r * 0.1); c.beginPath(); pts.forEach(([a, b], i) => (i ? c.lineTo(a * r, b * r) : c.moveTo(a * r, b * r))); c.closePath(); c.fillStyle = "rgba(180,230,255,.55)"; c.fill(); c.lineWidth = 4; c.strokeStyle = "#fff"; c.stroke(); outline(c, 2);
  c.fillStyle = "rgba(255,255,255,.6)"; c.beginPath(); c.moveTo(-0.6 * r, -0.8 * r); c.lineTo(-0.2 * r, -0.95 * r); c.lineTo(-0.75 * r, -0.2 * r); c.closePath(); c.fill();
  c.strokeStyle = "#ffffff"; c.lineWidth = 2.5; const cr = [[[0.1, -1.2], [0.25, -0.5], [0.05, 0]], [[1.1, 0.1], [0.45, 0.2], [0.2, 0.55]], [[-1.1, 0.5], [-0.5, 0.25], [-0.3, -0.3]]]; for (let i = 0; i < iceCracks; i++) { c.beginPath(); cr[i].forEach(([a, b], k) => (k ? c.lineTo(a * r, b * r) : c.moveTo(a * r, b * r))); c.stroke(); } c.restore(); }
function drawCracks(c, τ) { const u = clamp(τ / 0.5, 0, 1), a = τ > 2.6 ? Math.max(0, 1 - (τ - 2.6) * 2) : 1; c.save(); c.globalAlpha = a; c.strokeStyle = INK; c.lineWidth = 5; c.lineJoin = "round"; c.beginPath(); let x = S.me.x + 30, y = G + 6; c.moveTo(x, y); const end = lerp(S.me.x + 30, S.op.x, u); let k = 0; while (x < end) { x += 34; y = G + 6 + ((k++ % 2) ? 9 : -2); c.lineTo(Math.min(x, end), y); } c.stroke(); c.strokeStyle = "#ffd36b"; c.lineWidth = 1.5; c.stroke(); c.restore(); }
function portalRing(c, x, y, col, τ, a) { c.save(); c.globalAlpha = a; c.translate(x, y); c.scale(0.5, 1); for (let i = 0; i < 4; i++) { c.rotate(τ * 2 + i); c.beginPath(); c.arc(0, 0, 56 - i * 6, 0, 4.2); c.lineWidth = 9 - i * 1.5; c.strokeStyle = i % 2 ? "#ffffff" : col; c.stroke(); } const g = c.createRadialGradient(0, 0, 4, 0, 0, 50); g.addColorStop(0, "rgba(10,10,30,.95)"); g.addColorStop(1, hexA(col, 0.2)); c.fillStyle = g; circ(c, 0, 0, 46); c.fill(); c.restore(); }

// ---------- Hauptbild ----------
function drawField(c) {
  const sky = c.createLinearGradient(0, 0, 0, G); sky.addColorStop(0, "#16237a"); sky.addColorStop(1, "#3558d0");
  c.fillStyle = sky; c.fillRect(0, 0, VW, G);
  if (S.sky > 0) { c.save(); c.globalAlpha = S.sky; const g = c.createLinearGradient(0, 0, 0, G); g.addColorStop(0, "#2a0f5e"); g.addColorStop(1, "#7a3bd0"); c.fillStyle = g; c.fillRect(0, 0, VW, G); for (let i = 0; i < 40; i++) { const x = (i * 197) % VW, y = (i * 83) % (G - 60); c.globalAlpha = S.sky * (0.4 + 0.6 * Math.abs(Math.sin(T * 2 + i))); star(c, x, y, 2 + (i % 3), "#fff"); } c.restore(); }
  for (let i = 0; i * 100 < VW; i++) { c.fillStyle = i % 2 ? "#2a9a4b" : "#33ad57"; c.fillRect(i * 100, G, 100, VH - G); }
  c.strokeStyle = "rgba(255,255,255,.7)"; c.lineWidth = 3; c.beginPath(); c.moveTo(VW / 2, G); c.lineTo(VW / 2, VH); c.stroke();
  [0, 1].forEach(side => { const h = S.goalH[side], x0 = side ? VW - GOAL_W : 0, post = side ? x0 : GOAL_W; c.fillStyle = "rgba(255,255,255,.12)"; c.fillRect(x0, G - h, GOAL_W, h); c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 1.5; for (let x = x0 + 14; x < x0 + GOAL_W; x += 16) { c.beginPath(); c.moveTo(x + (S.wind ? Math.sin(T * 9 + x) * 3 * S.wind : 0), G - h); c.lineTo(x, G); c.stroke(); } for (let y = G - h + 14; y < G; y += 16) { c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + GOAL_W, y); c.stroke(); } c.strokeStyle = "#fff"; c.lineWidth = 9; c.lineCap = "round"; c.beginPath(); c.moveTo(post, G); c.lineTo(post, G - h); c.lineTo(side ? VW - 4 : 4, G - h); c.stroke(); });
}
function shadow(c, x, y, r) { const k = clamp(1 - (G - y) / 520, 0.25, 1); c.fillStyle = `rgba(0,0,0,${0.22 * k})`; c.beginPath(); c.ellipse(x, G + 4, r * k, 6 * k, 0, 0, TAU); c.fill(); }
function drawPlayer(c, h) {
  shadow(c, h.x, h.y + h.r, h.r * 0.9);
  drawHead(c, h);
  const p = shoePos(h), kick = h.kickT > 0 ? Math.sin((1 - h.kickT / 0.22) * Math.PI) : 0;
  drawShoe(c, p.x + h.dir * kick * 18, p.y - kick * 26, h.r * 1.05 * h.shoe, h.dir, h.shoeCol, -kick * 0.9);
}
function drawBadge(c, h, pu, k) {
  const x = h.x, y = h.y - h.r - 34, F = FAM[pu.fam];
  c.save(); circ(c, x, y, 17); c.fillStyle = F.col; c.fill(); outline(c, 2.5);
  c.beginPath(); c.arc(x, y, 21, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(k, 0, 1)); c.lineWidth = 3.5; c.strokeStyle = k < 0.2 && Math.sin(T * 30) > 0 ? "#ffd02b" : "#fff"; c.stroke();
  c.translate(x, y); drawIcon(c, pu.id, 8.5, T); c.restore();
}
function drawBanner(c, pu, τ) {
  if (τ < 0 || τ > 1.6) return;
  const F = FAM[pu.fam], s = τ < 0.25 ? lerp(0.7, 1.05, easeOut(τ / 0.25)) : τ < 0.4 ? lerp(1.05, 1, (τ - 0.25) / 0.15) : 1, a = τ > 1.3 ? 1 - (τ - 1.3) / 0.3 : 1;
  c.save(); c.globalAlpha = a; c.translate(VW / 2, 118 - (1 - Math.min(1, τ * 5)) * 40); c.rotate(-0.04); c.scale(s, s);
  c.textAlign = "center"; c.font = "44px 'Lilita One', Impact, sans-serif"; c.lineJoin = "round";
  c.lineWidth = 11; c.strokeStyle = INK; c.strokeText(pu.name.toUpperCase(), 0, 0); c.lineWidth = 4.5; c.strokeStyle = "#fff"; c.strokeText(pu.name.toUpperCase(), 0, 0); c.fillStyle = F.col; c.fillText(pu.name.toUpperCase(), 0, 0);
  c.rotate(0.04); c.font = "900 18px Nunito, sans-serif"; c.lineWidth = 5; c.strokeStyle = INK; c.strokeText(pu.tag, 0, 30); c.fillStyle = "#fff"; c.fillText(pu.tag, 0, 30);

}
function frame(dt) {
  if (hit > 0) { hit -= dt; dt = 0; }   // Hit-Stop: kurzer Halt beim Treffer
  T += dt; const pu = cur, F = FAM[pu.fam], τ = T - PHASE.act;
  S.me.kickT = Math.max(0, (S.me.kickT || 0) - dt);
  S.ball = null;
  // Ablauf

  if (T >= PHASE.hitAt) once("hit", () => collect(pu));
  if (leftover) { const L = leftover; L.vy += 1400 * dt; L.x += L.vx * dt; L.y += L.vy * dt; L.rot += L.vx * dt / BR; if (L.y > G - BR) { L.y = G - BR; L.vy *= -0.45; L.vx *= 0.8; } L.a = clamp(1 - (T - PHASE.hitAt - 0.6) * 2, 0, 1); if (L.a <= 0) leftover = null; }
  if (τ >= 0 && T < PHASE.actEnd) FX[pu.id].set(τ);
  if (T >= PHASE.actEnd) once("end", () => { S = scene(); sfx("puff"); const h = pu.to === "op" ? S.op : S.me; puff({ x: h.x, y: h.y - h.r - 34 }, 10); });
  if (T > PHASE.end + 0.4) { if (auto) { const i = PUS.indexOf(cur); select(PUS[(i + 1) % PUS.length]); } else restart(); return; }

  // Zeichnen
  const c = ctx, k = cv.width / VW;
  c.setTransform(k, 0, 0, k, 0, 0);
  if (shake > 0 && !reduce) { shake = Math.max(0, shake - dt * 1.6); c.translate((Math.random() - 0.5) * 22 * shake, (Math.random() - 0.5) * 16 * shake); }
  drawField(c);
  if (τ >= 0 && T < PHASE.actEnd && FX[pu.id].under) FX[pu.id].under(c, τ);
  // Ankündigung: Lichtstrahl und Schattenring
  if (T < PHASE.tele + 0.25) { const u = clamp(T / PHASE.tele, 0, 1), a = T < PHASE.tele ? Math.min(1, u * 2) : 1 - (T - PHASE.tele) / 0.25;
    c.save(); c.globalCompositeOperation = "lighter"; c.globalAlpha = a * 0.35 * (0.6 + 0.4 * Math.sin(T * 10)); const g = c.createRadialGradient(ORB.x, ORB.y, 0, ORB.x, ORB.y, 30 * u + 6); g.addColorStop(0, hexA(F.col, 0.9)); g.addColorStop(1, hexA(F.col, 0)); c.fillStyle = g; circ(c, ORB.x, ORB.y, 30 * u + 6); c.fill(); c.restore();
    c.save(); c.globalAlpha = a * 0.55; c.strokeStyle = F.col; c.lineWidth = 2.5; c.setLineDash([8, 8]); c.lineDashOffset = -T * 40; c.beginPath(); c.ellipse(ORB.x, G + 4, 30 + 4 * Math.sin(T * 6), 6, 0, 0, TAU); c.stroke(); c.restore(); }

  drawPlayer(c, S.op); drawPlayer(c, S.me);
  if (τ >= 0 && T < PHASE.actEnd && FX[pu.id].draw) FX[pu.id].draw(c, τ);
  if (leftover) drawBall(c, leftover);
  if (S.ball) { shadow(c, S.ball.x, S.ball.y + BR, BR); drawBall(c, S.ball); }
  // fliegendes Symbol

    const x = lerp(ORB.x, tx, u), y = lerp(ORB.y, ty, u) - Math.sin(u * Math.PI) * 90; c.save(); c.translate(x, y); c.scale(1.15 - u * 0.15, 1.15 - u * 0.15); circ(c, 0, 0, 18); c.fillStyle = F.col; c.fill(); outline(c, 3); drawIcon(c, pu.id, 9, T); c.restore();
    if (Math.random() < 0.5) P({ type: "spark", x, y, life: 0.25, size: 2.5, col: F.hi, add: true }); if (u >= 0.98) once("stamp", () => { sfx("stamp"); P({ type: "ring", x: tx, y: ty, life: 0.25, size: 16, grow: 30, col: "#fff", add: true, w: 3 }); }); }
  // Abzeichen mit Ablauf-Ring

  drawParts(c);
  drawBanner(c, pu, T - PHASE.flyEnd + 0.05);

}
function collect(pu) {
  const F = FAM[pu.fam];
  hit = 0.045; sfx("pick", pu.fam); setTimeout(() => sfx("whoosh"), 60);
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + Math.random() * 0.4; P({ type: "shard", x: ORB.x, y: ORB.y, vx: Math.cos(a) * (150 + Math.random() * 100), vy: Math.sin(a) * 150 - 90, g: 1100, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, life: 0.6, size: 3.5 + Math.random() * 2.5, col: hexA(F.col, 0.7), ground: true }); }
  for (let i = 0; i < (reduce ? 6 : 12); i++) { const a = i / 12 * TAU; P({ type: "spark", x: ORB.x, y: ORB.y, vx: Math.cos(a) * 280, vy: Math.sin(a) * 280, drag: 5, life: 0.35, size: 2.2, col: i % 2 ? F.hi : F.col, add: true }); }
  P({ type: "ring", x: ORB.x, y: ORB.y, life: 0.35, size: 30, grow: 90, col: F.col, add: true, w: 4 });
  leftover = { x: ORB.x - 22, y: ORB.y + 14, vx: 260, vy: -240, r: BR, rot: 0, a: 1 };

// ===================== Schleife, Raster, Bedienung =====================
let last = null;
function loop(ms) { if (last === null) last = ms; let dt = Math.min(0.05, (ms - last) / 1000); last = ms; if (slow) dt *= 0.3; frame(dt); drawCards(ms / 1000); requestAnimationFrame(loop); }
function fit() { const r = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth || 1000; cv.width = Math.round(w * r); cv.height = Math.round(w * r * VH / VW); }
const info = document.getElementById("info");
function showInfo() { const p = cur, F = FAM[p.fam]; info.innerHTML = `<b style="color:${F.col}">${p.name}</b> <span>· ${F.name} · ${p.st}${p.rk ? " · Ranked" : ""}</span><br>${p.ds}`; }
const grid = document.getElementById("grid"), cards = [];
function buildGrid() {
  for (const [fk, F] of Object.entries(FAM)) {
    const sec = document.createElement("section"); sec.className = "fam";
    sec.innerHTML = `<h2><i style="background:${F.col}"></i>${F.name} <small>${F.sub}</small></h2><div class="cards"></div>`;
    const box = sec.querySelector(".cards");
    for (const p of PUS.filter(q => q.fam === fk)) {
      const b = document.createElement("button"); b.className = "card"; b.setAttribute("aria-pressed", p === cur);
      b.innerHTML = `<canvas width="236" height="175" aria-hidden="true"></canvas><span class="nm" style="color:${F.col}">${p.name}</span><span class="chips"><span class="chip${p.st === "neu" ? " new" : ""}">${p.st}</span>${p.rk ? '<span class="chip rk">Ranked</span>' : ""}</span><span class="ds">${p.ds}</span>`;
      b.onclick = () => { initAudio(); select(p); document.querySelector(".stage").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" }); };
      box.append(b); cards.push({ p, b, cv: b.querySelector("canvas") });
    }
    grid.append(sec);
  }
}
function select(p) { cards.forEach(k => k.b.setAttribute("aria-pressed", k.p === p)); restart(p); }
function drawCards(t) {
  for (const k of cards) {
    const r = k.cv.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) continue;
    const dpr = Math.min(2, devicePixelRatio || 1), w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (k.cv.width !== w) { k.cv.width = w; k.cv.height = h; }
    const c = k.cv.getContext("2d"); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, h);
    const R = Math.min(w, h) * 0.29, y = h * 0.47 + Math.sin(t * 3 + cards.indexOf(k)) * h * 0.035;
    c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.ellipse(w / 2, h * 0.9, R * 0.8, R * 0.13, 0, 0, TAU); c.fill();
    drawOrb(c, k.p, w / 2, y, R, t + cards.indexOf(k) * 0.7);
  }
}
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } if (AC && AC.state === "suspended") AC.resume(); }
const tg = (id, f) => { const b = document.getElementById(id); b.onclick = () => { const v = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", v); f(v); }; };
document.getElementById("bAgain").onclick = () => { initAudio(); restart(); };
tg("bSlow", v => { slow = v; }); tg("bAuto", v => { auto = v; });
tg("bSound", v => { initAudio(); soundOn = v; document.getElementById("bSound").textContent = v ? "Ton aus" : "Ton an"; });
addEventListener("resize", fit);
buildGrid(); fit(); showInfo(); requestAnimationFrame(loop);
</script>
