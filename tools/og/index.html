<!doctype html>
<!-- Vorschaubild für geteilte Links (og.jpg, 1200×630). Erzeugt mit: node tools/og.mjs -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Lilita One"; src: url("../../fonts/lilita.woff2") format("woff2"); }
@font-face { font-family: Nunito; src: url("../../fonts/nunito-900.woff2") format("woff2"); font-weight: 900; }
html, body { margin: 0; }
#og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: linear-gradient(#1b2b6b, #2e4fa8 62%, #2aa05a 62%, #3fb46c); font-family: "Lilita One", Impact, sans-serif; }
#og::after { content: ""; position: absolute; inset: 62% 0 0; background: repeating-linear-gradient(90deg, rgb(255 255 255 / 6%) 0 86px, transparent 86px 172px); }
h1 { position: absolute; top: 34px; left: 0; right: 0; margin: 0; text-align: center; font-weight: 400; font-size: 168px; line-height: .9; letter-spacing: 2px; transform: rotate(-3deg); z-index: 2;
  color: #fff8e8; -webkit-text-stroke: 14px #15112e; paint-order: stroke fill; text-shadow: 0 10px 0 #15112e; }
h1 span { color: #ffb020; }
.head { position: absolute; bottom: 40px; z-index: 3; filter: drop-shadow(0 8px 0 rgb(21 17 46 / 60%)); }
#h0 { left: 40px; } #h1 { right: 40px; }
#ball { position: absolute; left: 545px; top: 318px; z-index: 3; }
p { position: absolute; bottom: 26px; left: 0; right: 0; margin: 0; text-align: center; z-index: 4; font: 900 34px Nunito, sans-serif; color: #fff; text-shadow: 0 3px 0 #15112e; }
</style>
</head>
<body>
<div id="og">
  <h1>HEAD<span>STARS</span></h1>
  <div class="head" id="h0"></div><div class="head" id="h1"></div><div id="ball"></div>
  <p>Online gegen Kumpels · per Link · ohne Download</p>
</div>
<script type="module">
import { avatarCanvas, drawBall } from "../../js/ui/render/art.js";
const q = new URLSearchParams(location.search), heads = (q.get("heads") || "kalle,nala").split(",");
await document.fonts.load("168px 'Lilita One'"); await document.fonts.load("900 34px Nunito");
document.getElementById("h0").append(avatarCanvas(heads[0], 400, { dir: 1, mood: "happy" }));
document.getElementById("h1").append(avatarCanvas(heads[1], 400, { dir: -1 }));
const c = document.createElement("canvas"); c.width = c.height = 110; const x = c.getContext("2d");
drawBall(x, "klassik", 55, 55, 46, 0.4, 1, null, { t: 1 }); document.getElementById("ball").append(c);
document.body.dataset.ready = "1";
</script>
</body>
</html>
