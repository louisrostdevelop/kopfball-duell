name: Tests
on:
  push:
  pull_request:

jobs:
  spiellogik:
    name: Spiellogik (Referenzspiele + Matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  browser:
    name: Browser (Menüs, Steuerung, Online, Handy-Layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
